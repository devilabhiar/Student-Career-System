<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease-in-out;
        }

        h2 {
            font-weight: 700;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        label {
            color: #fff;
            font-weight: 500;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-custom {
            background: #009ffd;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: #007bdb;
        }

        .glass-link {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }

        .glass-link:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h2 class="text-center mb-4">Student Login</h2>

        <!-- Alert Placeholder -->
        <div id="alertPlaceholder" class="mt-2"></div>

        <form action="login" method="post">
            <div class="mb-3">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" required />
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required />
            </div>

            <div class="text-end mb-3">
                <a href="student-reset-password.jsp" class="glass-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-custom w-100">Login</button>
        </form>

        <div class="text-center mt-4">
            <span class="text-white">Don't have an account?</span>
            <br>
            <a href="student-signup.html" class="btn btn-outline-light btn-sm mt-2">Sign Up</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const alertPlaceholder = document.getElementById("alertPlaceholder");

        if (urlParams.get("error") === "invalid") {
            alertPlaceholder.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    Invalid email or password. Please try again.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
        }

        if (urlParams.get("success") === "1") {
            alertPlaceholder.innerHTML = `
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    Signup successful! Please log in to continue.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
