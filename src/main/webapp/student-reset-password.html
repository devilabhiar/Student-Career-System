<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <style>
    .toggle-password {
      cursor: pointer;
      position: absolute;
      right: 10px;
      top: 38px;
      color: #555;
    }
    .position-relative {
      position: relative;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h3 class="text-center">Reset Password</h3>

    <div id="alertPlaceholder"></div>

    <form action="reset-password" method="post" class="mx-auto mt-4 needs-validation" style="max-width: 400px;" novalidate onsubmit="return validatePasswordMatch()">
      <div class="mb-3 position-relative">
        <label for="password" class="form-label">New Password</label>
        <input type="password" name="newPassword" class="form-control" id="password" required minlength="5" />
        <span class="toggle-password" onclick="togglePassword('password')">&#128065;</span>
        <div class="invalid-feedback">Please enter a new password (min 5 characters).</div>
      </div>

      <div class="mb-3 position-relative">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="confirmPassword" required minlength="5" />
        <span class="toggle-password" onclick="togglePassword('confirmPassword')">&#128065;</span>
        <div class="invalid-feedback">Please confirm your password.</div>
      </div>

      <div class="text-danger mb-3" id="errorMsg" style="display: none;"></div>

      <button type="submit" class="btn btn-success w-100">Update Password</button>
    </form>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const alertPlaceholder = document.getElementById("alertPlaceholder");

    if (urlParams.get("success") === "1") {
      alertPlaceholder.innerHTML = `
        <div class="alert alert-success mt-3" role="alert">
          ✅ Password updated successfully. <a href="student-login.html">Login now</a>.
        </div>`;
    } else if (urlParams.get("error") === "1") {
      alertPlaceholder.innerHTML = `
        <div class="alert alert-danger mt-3" role="alert">
          ❌ Something went wrong. Please try again.
        </div>`;
    }

    function validatePasswordMatch() {
      const pass = document.getElementById("password").value.trim();
      const confirm = document.getElementById("confirmPassword").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (pass !== confirm) {
        errorMsg.textContent = "⚠️ Passwords do not match!";
        errorMsg.style.display = "block";
        return false;
      } else {
        errorMsg.style.display = "none";
        return true;
      }
    }

    // Bootstrap validation
    (() => {
      'use strict';
      const forms = document.querySelectorAll('.needs-validation');
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
          }
          form.classList.add('was-validated');
        }, false);
      });
    })();

    function togglePassword(id) {
      const field = document.getElementById(id);
      field.type = field.type === "password" ? "text" : "password";
    }
  </script>
</body>
</html>
